plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.apexludo.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.apexludo.game"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.2"
        testInstrumentationRunner "android.test.InstrumentationTestRunner"
        resourceConfigurations += ["en", "hi", "bn", "ta", "te", "mr", "gu", "kn", "ml", "pa", "es", "fr", "pt", "id", "ar", "ru"]
    }

    def ksPath = System.getenv("APEX_KEYSTORE") ?: "${rootDir}/beta-release.jks"
    def ksFile = file(ksPath)

    signingConfigs {
        if (ksFile.exists()) {
            release {
                storeFile ksFile
                storePassword System.getenv("APEX_STORE_PASS") ?: "apexludo"
                keyAlias System.getenv("APEX_KEY_ALIAS") ?: "apexludo"
                keyPassword System.getenv("APEX_KEY_PASS") ?: "apexludo"
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            applicationIdSuffix ""
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (ksFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ["-Xjvm-default=all"]
    }
    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.all { test ->
            test.testLogging { events "passed", "skipped", "failed" }
        }
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    packaging {
        resources.excludes += ["META-INF/*.kotlin_module", "META-INF/*.version", "DebugProbesKt.bin"]
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
