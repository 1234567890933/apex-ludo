name: Build Apex Ludo 1.1 (APK)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    name: Test, then compile APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        run: |
          set -e
          SDK_ROOT=/usr/local/lib/android/sdk
          if [ ! -d "$SDK_ROOT" ]; then SDK_ROOT="$ANDROID_HOME"; fi
          echo "Using SDK at $SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          CMDLINE=$(dirname "$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -1)")
          echo "cmdline-tools: $CMDLINE"
          echo "$CMDLINE" >> "$GITHUB_PATH"

      - name: Install SDK packages
        run: |
          set -e
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          sdkmanager --list_installed | head -20

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit, rules and stress tests
        run: ./gradlew :app:testDebugUnitTest --console=plain --no-daemon

      - name: Create beta signing key
        run: |
          keytool -genkeypair -v -keystore beta-release.jks -alias apexludo \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass apexludo -keypass apexludo \
            -dname "CN=Apex Ludo Beta, OU=Beta Builds, O=Apex Ludo, L=Bengaluru, S=Karnataka, C=IN"

      - name: Compile release and debug APKs
        run: ./gradlew :app:assembleRelease :app:assembleDebug --console=plain --no-daemon

      - name: Collect artifacts
        run: |
          mkdir -p out
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk out/ApexLudo-1.1-beta-release.apk
          fi
          cp app/build/outputs/apk/debug/app-debug.apk out/ApexLudo-1.1-beta-debug.apk
          for f in out/*.apk; do
            echo "== $f =="
            $ANDROID_HOME/build-tools/34.0.0/aapt dump badging "$f" | head -3
            ls -lh "$f"
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apex-ludo-1.1-beta-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-ludo-test-reports
          path: app/build/reports/tests/
          if-no-files-found: warn
